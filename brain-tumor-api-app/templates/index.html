<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brain Tumor MRI Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; }
        .container { max-width: 500px; margin-top: 80px; }
        .result-info { font-size: 1.3rem; }
    </style>
</head>
<body>
    <div class="container shadow rounded bg-white p-5">
        <h1 class="mb-4 text-center">Brain Tumor MRI Detector</h1>
        <form method="POST" enctype="multipart/form-data" class="mb-3">
            <input type="file" name="file" class="form-control mb-3" accept="image/*" required>
            <button type="submit" class="btn btn-primary w-100">Detect Tumor</button>
        </form>
        {% if result %}
            <div class="alert alert-success result-info text-center" role="alert">
                {{ result }}
            </div>
        {% elif error %}
            <div class="alert alert-danger text-center" role="alert">
                {{ error }}
            </div>
        {% endif %}
        <div class="text-center text-muted mt-4" style="font-size: 0.93rem;">
            <strong>Disclaimer:</strong> This is a demo app for learning use only.
        </div>
    </div>
</body>
</html>
